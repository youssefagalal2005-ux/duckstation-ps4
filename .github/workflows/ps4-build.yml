name: Build DuckStation PS4 (XMB UI)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'src/duckstation-ps4/**'
      - '.github/workflows/ps4-build.yml'

jobs:
  configure-ps1-covers:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. سحب كود DuckStation وملفات الدعم
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. سحب مشروع DolphinPS4 لاستخراج أصول الواجهة (XMB)
        run: |
          git clone --depth=1 https://github.com/iHaiDeeZ/DolphinPS4.git ${GITHUB_WORKSPACE}/dolphin-ps4-ref
          mkdir -p ${GITHUB_WORKSPACE}/src/duckstation-ps4/xmb-assets
          cp -r ${GITHUB_WORKSPACE}/dolphin-ps4-ref/xmb/* ${GITHUB_WORKSPACE}/src/duckstation-ps4/xmb-assets/

      - name: 3. تخصيص مسارات Covers ألعاب الـ PS1 حصرياً
        run: |
          echo "Configuring Box Art / Cover downloader links for PlayStation 1 (PS1)..."
          
          # تعديل ملف الإعدادات الافتراضية لتوجيه جلب صور أغطية ألعاب PS1
          CONFIG_FILE="${GITHUB_WORKSPACE}/src/duckstation-ps4/xmb-assets/ps4-defaults.ini"
          
          if [ -f "$CONFIG_FILE" ]; then
            echo "Updating cover art URL for PS1 in ps4-defaults.ini..."
            echo "CoverDatabaseURL = https://raw.githubusercontent.com/stenzek/duckstation/master/ee/covers/ps1/" >> "$CONFIG_FILE"
          else
            echo "Creating new ps4-defaults.ini with PS1 cover configurations..."
            mkdir -p ${GITHUB_WORKSPACE}/src/duckstation-ps4/xmb-assets/
            echo "[CoverArt]" > "$CONFIG_FILE"
            echo "CoverDatabaseURL = https://raw.githubusercontent.com/stenzek/duckstation/master/ee/covers/ps1/" >> "$CONFIG_FILE"
          fi
          
          cat "$CONFIG_FILE"

      - name: 4. رفع الملفات الجاهزة للتأكيد
        uses: actions/upload-artifact@v4
        with:
          name: DuckStation-PS1-XMB-Ready
          path: ${GITHUB_WORKSPACE}/src/duckstation-ps4/xmb-assets/
