name: Build DuckStation PS4 (XMB UI)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'src/duckstation-ps4/**'
      - '.github/workflows/ps4-build.yml'

jobs:
  extract-and-prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. سحب الكود المصدري لمحاكي DuckStation
        uses: actions/checkout@v4

      - name: 2. سحب مشروع DolphinPS4 لاستخراج الـ XMB وتعريفات Vulkan
        run: |
          git clone --depth=1 https://github.com/iHaiDeeZ/DolphinPS4.git ${GITHUB_WORKSPACE}/dolphin-ps4-ref

      - name: 3. استخراج ملفات كود واجهة الـ XMB من الباتش وتحليل هيكلها
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/extracted-xmb
          cd ${GITHUB_WORKSPACE}/dolphin-ps4-ref
          
          # عرض قائمة بجميع ملفات الكود الجديدة الموجودة داخل الباتش
          echo "=== Files inside dolphin-ps4.patch ===" > ${GITHUB_WORKSPACE}/extracted-xmb/patch-summary.txt
          grep -E "^diff --git " patches/dolphin-ps4.patch >> ${GITHUB_WORKSPACE}/extracted-xmb/patch-summary.txt || true
          
          # نسخ ملف الباتش وسكريبتات البناء والـ port لتحليلها وربطها بـ DuckStation
          cp patches/dolphin-ps4.patch ${GITHUB_WORKSPACE}/extracted-xmb/
          cp -r scripts ${GITHUB_WORKSPACE}/extracted-xmb/
          cp -r toolchain ${GITHUB_WORKSPACE}/extracted-xmb/
          cp -r port ${GITHUB_WORKSPACE}/extracted-xmb/
          
          cat ${GITHUB_WORKSPACE}/extracted-xmb/patch-summary.txt

      - name: 4. رفع ملفات الـ XMB المستخرجة لتحميلها
        uses: actions/upload-artifact@v4
        with:
          name: DolphinPS4-XMB-Source-Code
          path: ${GITHUB_WORKSPACE}/extracted-xmb/
