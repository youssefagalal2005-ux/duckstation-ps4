name: Build DuckStation PS4 (XMB UI)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - '.github/workflows/ps4-build.yml'

jobs:
  prepare-ps4-package:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. سحب الكود المصدري للمشروع
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. سحب أصول وواجهة الـ PS4 من المرجع
        run: |
          git clone --depth=1 https://github.com/iHaiDeeZ/DolphinPS4.git ${GITHUB_WORKSPACE}/dolphin-ps4-ref
          mkdir -p ${GITHUB_WORKSPACE}/ps4-ready-output/duckstation-ps4
          
          # نسخ ملفات النظام والواجهة
          cp -r ${GITHUB_WORKSPACE}/dolphin-ps4-ref/sce_sys ${GITHUB_WORKSPACE}/ps4-ready-output/duckstation-ps4/ 2>/dev/null || true
          cp -r ${GITHUB_WORKSPACE}/dolphin-ps4-ref/xmb ${GITHUB_WORKSPACE}/ps4-ready-output/duckstation-ps4/ 2>/dev/null || true

      - name: 3. ضبط مسار Covers ألعاب PS1 حصرياً
        run: |
          CONFIG_FILE="${GITHUB_WORKSPACE}/ps4-ready-output/duckstation-ps4/xmb/ps4-defaults.ini"
          mkdir -p $(dirname "$CONFIG_FILE")
          echo "[CoverArt]" > "$CONFIG_FILE"
          echo "CoverDatabaseURL = https://raw.githubusercontent.com/stenzek/duckstation/master/ee/covers/ps1/" >> "$CONFIG_FILE"
          echo "PS1 Cover Art path configured successfully."

      - name: 4. رفع ملفات البنية الجاهزة كأرتيفاكت
        uses: actions/upload-artifact@v4
        with:
          name: DuckStation-PS4-XMB-Assets
          path: ${GITHUB_WORKSPACE}/ps4-ready-output/
