name: Build DuckStation PS4 (XMB UI)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - '.github/workflows/ps4-build.yml'

jobs:
  finalize-ps4-package:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. سحب الكود المصدري للمشروع
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. إنشاء مجلد الأصول ونسخ ملفات الواجهة والنظام
        run: |
          git clone --depth=1 https://github.com/iHaiDeeZ/DolphinPS4.git temp-ref
          mkdir -p ps4-output/duckstation-ps4
          
          # نسخ الملفات مباشرة إلى مجلد الإخراج المباشر للـ Artifact
          cp -r temp-ref/sce_sys ps4-output/duckstation-ps4/ 2>/dev/null || true
          cp -r temp-ref/xmb ps4-output/duckstation-ps4/ 2>/dev/null || true

      - name: 3. ضبط مسار Covers ألعاب PS1 حصرياً
        run: |
          CONFIG_FILE="ps4-output/duckstation-ps4/xmb/ps4-defaults.ini"
          mkdir -p $(dirname "$CONFIG_FILE")
          echo "[CoverArt]" > "$CONFIG_FILE"
          echo "CoverDatabaseURL = https://raw.githubusercontent.com/stenzek/duckstation/master/ee/covers/ps1/" >> "$CONFIG_FILE"

      - name: 4. رفع الحزمة النهائية المكتملة
        uses: actions/upload-artifact@v4
        with:
          name: DuckStation-PS4-XMB-Final-Package
          path: ps4-output/
