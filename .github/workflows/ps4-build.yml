name: Build DuckStation PS4 (XMB UI)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'src/duckstation-ps4/**'
      - '.github/workflows/ps4-build.yml'

jobs:
  prepare-sources:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. سحب الكود المصدري لمحاكي DuckStation
        uses: actions/checkout@v4

      - name: 2. سحب مشروع DolphinPS4 بالكامل
        run: |
          git clone --depth=1 https://github.com/iHaiDeeZ/DolphinPS4.git ${GITHUB_WORKSPACE}/dolphin-ps4-ref

      - name: 3. نسخ كافة ملفات الإعدادات والسكريبتات إلى مستودعك المحلّي
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/src/duckstation-ps4/ps4-support
          cp -r ${GITHUB_WORKSPACE}/dolphin-ps4-ref/port ${GITHUB_WORKSPACE}/src/duckstation-ps4/ps4-support/
          cp -r ${GITHUB_WORKSPACE}/dolphin-ps4-ref/toolchain ${GITHUB_WORKSPACE}/src/duckstation-ps4/ps4-support/
          cp -r ${GITHUB_WORKSPACE}/dolphin-ps4-ref/scripts ${GITHUB_WORKSPACE}/src/duckstation-ps4/ps4-support/
          
          # عرض المجلدات التي تم نسخها بنجاح
          ls -la ${GITHUB_WORKSPACE}/src/duckstation-ps4/ps4-support/

      - name: 4. رفع الملفات كأرتيفاكت للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Support-Files
          path: ${GITHUB_WORKSPACE}/src/duckstation-ps4/ps4-support/
    
