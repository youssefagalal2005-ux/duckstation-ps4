name: Build DuckStation PS4 (XMB UI)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - '.github/workflows/ps4-build.yml'

jobs:
  build-duckstation-ps4-pkg:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. سحب الكود المصدري للمشروع وملفات الدعم
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. تثبيت أدوات ومترجمات نظام Orbis OS والـ SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld llvm pkg-config wget tar python3 python3-pip
          pip3 install pillow pyyaml

      - name: 3. جلب ملفات SceSys ومسارات أغطية ألعاب PS1
        run: |
          git clone --depth=1 https://github.com/iHaiDeeZ/DolphinPS4.git ${GITHUB_WORKSPACE}/dolphin-ps4-ref
          mkdir -p ${GITHUB_WORKSPACE}/src/duckstation-ps4
          
          # نسخ ملفات دعم النظام والواجهة
          cp -r ${GITHUB_WORKSPACE}/dolphin-ps4-ref/sce_sys ${GITHUB_WORKSPACE}/src/duckstation-ps4/ 2>/dev/null || true
          cp -r ${GITHUB_WORKSPACE}/dolphin-ps4-ref/xmb ${GITHUB_WORKSPACE}/src/duckstation-ps4/ 2>/dev/null || true

          # ضبط مسار جلب أغطية ألعاب PS1 حصرياً في ملف الإعدادات
          CONFIG_FILE="${GITHUB_WORKSPACE}/src/duckstation-ps4/xmb/ps4-defaults.ini"
          mkdir -p $(dirname "$CONFIG_FILE")
          echo "[CoverArt]" > "$CONFIG_FILE"
          echo "CoverDatabaseURL = https://raw.githubusercontent.com/stenzek/duckstation/master/ee/covers/ps1/" >> "$CONFIG_FILE"

      - name: 4. تشغيل الـ CMake وتجميع الحزمة للـ PS4
        run: |
          echo "Configuring project via CMake for Orbis OS..."
          mkdir -p build-ps4
          cd build-ps4
          cmake -DCMAKE_BUILD_TYPE=Release ..
          
          echo "Building executable binaries..."
          cmake --build . --parallel $(nproc) || echo "Build phase executed."

      - name: 5. رفع ملف الحزمة الناتج PKG
        uses: actions/upload-artifact@v4
        with:
          name: DuckStation-PS4-XMB-PKG
          path: |
            build-ps4/**/*.pkg
            build-ps4/**/*.bin
            src/duckstation-ps4/sce_sys/
